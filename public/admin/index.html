<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Administration — ONG IST</title>
    <link rel="icon" href="/logo-ist.png" />
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      #attente {
        padding: 3rem 1.5rem;
        max-width: 34rem;
        margin: 0 auto;
        color: #1f2937;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <!--
      Interface d'administration Decap CMS : téléverser un rapport annuel en
      PDF et publier une actualité sans toucher au code.

      Connexion en ligne  : compte GitHub, via api/auth.js et api/callback.js.
      Connexion en local  : `npm run dev` et `npm run admin` dans deux
                            terminaux, puis http://localhost:4321/admin/.

      Voir la section « Espace d'administration » du README.
    -->
    <div id="attente">
      <h1>Espace d'administration</h1>
      <p>Chargement de l'interface…</p>
    </div>

    <script src="https://unpkg.com/decap-cms@3.8.4/dist/decap-cms.js"></script>
    <script>
      // Si le script ci-dessus n'a pas pu être chargé (réseau coupé, CDN
      // bloqué), on l'explique plutôt que de laisser une page vide.
      window.addEventListener("load", function () {
        var attente = document.getElementById("attente");
        if (window.CMS) {
          attente.remove();
          return;
        }
        attente.innerHTML =
          "<h1>Espace d'administration</h1><p>L'interface n'a pas pu être chargée. " +
          "Vérifiez la connexion Internet, puis rechargez la page.</p>";
      });
    </script>
  </body>
</html>
