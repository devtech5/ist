# Configuration de l'espace d'administration (Decap CMS).
#
# Deux modes de connexion :
#   * en ligne, sur https://ong-ist.org/admin/ : authentification GitHub via les
#     fonctions serverless api/auth.js et api/callback.js (voir README) ;
#   * en local, avec `npm run admin` dans un second terminal : Decap écrit
#     directement dans les fichiers du dépôt, sans compte ni mot de passe.

backend:
  name: github
  repo: devtech5/ist
  branch: main
  # Racine des fonctions d'authentification déployées avec le site.
  base_url: https://ong-ist.org
  auth_endpoint: api/auth
  commit_messages:
    create: "contenu: ajout de {{slug}}"
    update: "contenu: mise à jour de {{slug}}"
    delete: "contenu: suppression de {{slug}}"
    uploadMedia: "contenu: ajout du fichier {{path}}"
    deleteMedia: "contenu: suppression du fichier {{path}}"

# Active l'édition hors ligne quand la page est ouverte depuis localhost.
local_backend: true

# Dossier où atterrissent les fichiers téléversés (PDF, images de couverture).
media_folder: "public/rapports"
public_folder: "/rapports"

locale: "fr"

# Les titres français sont convertis en adresses sans accent ni caractère
# spécial (« Réunion à San-Pédro » devient « reunion-a-san-pedro »).
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "rapports"
    label: "Rapports annuels"
    label_singular: "Rapport annuel"
    description: "Un rapport par année. Le PDF est téléversé ici même."
    folder: "src/content/rapports"
    create: true
    slug: "rapport-{{annee}}"
    summary: "{{annee}} — {{titre}}"
    sortable_fields: ["annee"]
    fields:
      - { name: "annee", label: "Année", widget: "number", value_type: "int" }
      - { name: "titre", label: "Titre affiché", widget: "string" }
      - {
          name: "titre_en",
          label: "Titre affiché en anglais",
          widget: "string",
          required: false,
          hint: "Facultatif. Sans traduction, le titre français est repris.",
        }
      - {
          name: "fichier",
          label: "Fichier PDF du rapport",
          widget: "file",
          required: false,
          hint: "Téléversez le PDF. Tant qu'aucun fichier n'est joint, la carte s'affiche en grisé.",
        }
      - {
          name: "couverture",
          label: "Image de couverture",
          widget: "image",
          required: false,
          hint: "Facultatif. Sans image, une couverture bleue portant l'année est générée automatiquement.",
        }
      - {
          name: "exemple",
          label: "Carte de démonstration",
          widget: "boolean",
          required: false,
          default: false,
          hint: "À cocher uniquement pour une carte d'exemple, affichée en grisé et sans lien.",
        }

  - name: "actualites"
    label: "Actualités (français)"
    label_singular: "Actualité"
    description: "Version française des articles. La traduction anglaise se saisit dans « News (English) », avec la même adresse."
    folder: "src/content/actualites"
    create: true
    slug: "{{fields.cle}}"
    summary: "{{date}} — {{titre}}"
    sortable_fields: ["date", "titre"]
    fields:
      - {
          name: "cle",
          label: "Adresse de l'article",
          widget: "string",
          pattern:
            ["^[a-z0-9]+(-[a-z0-9]+)*$", "Lettres minuscules non accentuées, chiffres et traits d'union uniquement."],
          hint: "Apparaît dans l'URL, par exemple depistage-gratuit-san-pedro. Doit être identique à celle de la version anglaise.",
        }
      - { name: "lang", label: "Langue", widget: "hidden", default: "fr" }
      - { name: "titre", label: "Titre", widget: "string" }
      - {
          name: "date",
          label: "Date",
          widget: "datetime",
          date_format: "YYYY-MM-DD",
          time_format: false,
          format: "YYYY-MM-DD",
          picker_utc: true,
        }
      - { name: "lieu", label: "Lieu", widget: "string", required: false }
      - {
          name: "chapeau",
          label: "Résumé",
          widget: "text",
          hint: "Deux ou trois phrases, reprises sur la liste des actualités et dans les partages.",
        }
      - { name: "body", label: "Contenu", widget: "markdown" }

  - name: "actualites_en"
    label: "News (English)"
    label_singular: "News item"
    description: "Traduction anglaise. Reprenez exactement l'« Adresse de l'article » de la version française."
    folder: "src/content/actualites/en"
    create: true
    slug: "{{fields.cle}}"
    summary: "{{date}} — {{titre}}"
    sortable_fields: ["date", "titre"]
    fields:
      - {
          name: "cle",
          label: "Adresse de l'article",
          widget: "string",
          pattern:
            ["^[a-z0-9]+(-[a-z0-9]+)*$", "Lettres minuscules non accentuées, chiffres et traits d'union uniquement."],
          hint: "Identique à celle de la version française : c'est ce qui relie les deux langues.",
        }
      - { name: "lang", label: "Langue", widget: "hidden", default: "en" }
      - { name: "titre", label: "Title", widget: "string" }
      - {
          name: "date",
          label: "Date",
          widget: "datetime",
          date_format: "YYYY-MM-DD",
          time_format: false,
          format: "YYYY-MM-DD",
          picker_utc: true,
        }
      - { name: "lieu", label: "Place", widget: "string", required: false }
      - { name: "chapeau", label: "Summary", widget: "text" }
      - { name: "body", label: "Content", widget: "markdown" }

  # ── Textes et données du site ────────────────────────────────────────────
  # Chaque rubrique correspond à un fichier de src/data/. Tous les champs
  # déclarés ici sont réécrits à l'enregistrement : ne pas en retirer.
  - name: "site"
    label: "Textes du site"
    label_singular: "Rubrique"
    editor:
      preview: false
    files:
      - name: "identite"
        label: "Identité, vision et missions"
        file: "src/data/identite.json"
        description: "Nom de l'ONG, devise, texte de présentation, vision et missions."
        fields:
          - { name: "nom", label: "Nom complet", widget: "string" }
          - { name: "sigle", label: "Sigle", widget: "string" }
          - name: "baseline"
            label: "Baseline"
            widget: "object"
            hint: "Sous-titre affiché sous le nom, dans l'en-tête et le pied de page."
            fields: &bilingueCourt
              - { name: "fr", label: "Français", widget: "string" }
              - { name: "en", label: "English", widget: "string" }
          - { name: "devise", label: "Devise", widget: "object", fields: *bilingueCourt }
          - {
              name: "creation",
              label: "Date de création (en clair)",
              widget: "object",
              fields: *bilingueCourt,
            }
          - {
              name: "anneeCreation",
              label: "Année de création",
              widget: "number",
              value_type: "int",
            }
          - name: "description"
            label: "Description courte"
            widget: "object"
            hint: "Deux lignes. Sert aux moteurs de recherche et aux partages sur les réseaux sociaux."
            fields: &bilingueLong
              - { name: "fr", label: "Français", widget: "text" }
              - { name: "en", label: "English", widget: "text" }
          - {
              name: "presentation",
              label: "Texte de présentation",
              widget: "object",
              fields: *bilingueLong,
            }
          - { name: "vision", label: "Vision", widget: "object", fields: *bilingueLong }
          - name: "missions"
            label: "Missions"
            label_singular: "Mission"
            widget: "list"
            summary: "{{fields.fr}}"
            fields: *bilingueLong

      - name: "contact"
        label: "Contact et réseaux sociaux"
        file: "src/data/contact.json"
        description: "Adresse du siège, téléphones, courriel et liens vers les réseaux sociaux."
        fields:
          - { name: "siege", label: "Adresse du siège", widget: "object", fields: *bilingueCourt }
          - { name: "ville", label: "Ville et pays", widget: "object", fields: *bilingueCourt }
          - { name: "boitePostale", label: "Boîte postale", widget: "string" }
          - {
              name: "telephone",
              label: "Téléphone affiché",
              widget: "string",
              hint: "Tel qu'il doit apparaître, par exemple +225 27 34 76 93 90.",
            }
          - {
              name: "telephoneLien",
              label: "Téléphone pour l'appel",
              widget: "string",
              hint: "Le même numéro sans espace ni tiret, par exemple +2252734769390.",
            }
          - {
              name: "whatsapp",
              label: "Numéro WhatsApp",
              widget: "string",
              hint: "Indicatif pays sans le +, par exemple 2250748603631.",
            }
          - { name: "whatsappAffichage", label: "Numéro WhatsApp affiché", widget: "string" }
          - { name: "email", label: "Adresse électronique", widget: "string" }
          - name: "reseaux"
            label: "Réseaux sociaux"
            label_singular: "Réseau"
            widget: "list"
            summary: "{{fields.nom}}"
            hint: "Une entrée dont l'adresse reste vide n'est pas affichée sur le site."
            fields:
              - { name: "nom", label: "Nom", widget: "string" }
              - { name: "url", label: "Adresse", widget: "string", required: false }

      - name: "institution"
        label: "Chiffres, zones, agréments et équipe"
        file: "src/data/institution.json"
        description: "Chiffres clés, zones d'intervention, domaines d'action, effectifs, agréments, distinctions et moyens matériels."
        fields:
          - name: "chiffres"
            label: "Chiffres clés"
            label_singular: "Chiffre"
            widget: "list"
            summary: "{{fields.valeur}} — {{fields.label.fr}}"
            fields:
              - { name: "valeur", label: "Valeur", widget: "number", value_type: "int" }
              - {
                  name: "brut",
                  label: "Ne pas séparer les milliers",
                  widget: "boolean",
                  required: false,
                  default: false,
                  hint: "À cocher pour une année, qui s'écrit 1998 et non 1 998.",
                }
              - {
                  name: "suffixe",
                  label: "Suffixe",
                  widget: "string",
                  required: false,
                  hint: "Par exemple + pour afficher « 199 000+ ».",
                }
              - { name: "label", label: "Légende", widget: "object", fields: *bilingueCourt }
          - name: "zones"
            label: "Zones d'intervention"
            widget: "list"
            hint: "Une zone par entrée. Le compteur de la page « À propos » se met à jour tout seul."
          - name: "domaines"
            label: "Domaines d'action"
            label_singular: "Domaine"
            widget: "list"
            summary: "{{fields.titre.fr}}"
            hint: "Les réalisations de terrain sont classées par domaine. Ne pas modifier un identifiant déjà utilisé : le filtre se viderait."
            fields:
              - {
                  name: "slug",
                  label: "Identifiant",
                  widget: "string",
                  pattern:
                    [
                      "^[a-z0-9]+(-[a-z0-9]+)*$",
                      "Lettres minuscules non accentuées, chiffres et traits d'union.",
                    ],
                }
              - { name: "titre", label: "Titre", widget: "object", fields: *bilingueCourt }
              - { name: "resume", label: "Résumé", widget: "object", fields: *bilingueLong }
          - name: "personnel"
            label: "Effectifs"
            label_singular: "Fonction"
            widget: "list"
            summary: "{{fields.fonction.fr}} — {{fields.total}}"
            fields:
              - { name: "fonction", label: "Fonction", widget: "object", fields: *bilingueCourt }
              - { name: "total", label: "Total", widget: "number", value_type: "int" }
              - { name: "hommes", label: "Hommes", widget: "number", value_type: "int" }
              - { name: "femmes", label: "Femmes", widget: "number", value_type: "int" }
          - name: "agrements"
            label: "Agréments et publications officielles"
            label_singular: "Agrément"
            widget: "list"
            summary: "{{fields.intitule.fr}}"
            fields:
              - { name: "intitule", label: "Intitulé", widget: "object", fields: *bilingueCourt }
              - { name: "date", label: "Date en clair", widget: "object", fields: *bilingueCourt }
          - name: "reseauxMembre"
            label: "Réseaux dont l'ONG est membre"
            widget: "list"
            hint: "Sigles, une entrée par réseau."
          - name: "distinctions"
            label: "Distinctions"
            label_singular: "Distinction"
            widget: "list"
            summary: "{{fields.intitule.fr}}"
            fields:
              - { name: "intitule", label: "Intitulé", widget: "object", fields: *bilingueCourt }
              - { name: "decerne", label: "Décernée par", widget: "object", fields: *bilingueCourt }
              - {
                  name: "date",
                  label: "Date en clair",
                  widget: "object",
                  required: false,
                  fields: *bilingueCourt,
                }
          - name: "materiel"
            label: "Moyens matériels"
            label_singular: "Moyen"
            widget: "list"
            summary: "{{fields.fr}}"
            fields: *bilingueCourt

      - name: "partenaires"
        label: "Partenaires"
        file: "src/data/partenaires.json"
        description: "Les partenaires du bandeau défilant et du mur de la page d'accueil."
        media_folder: "../../public/images/partenaires"
        public_folder: "/images/partenaires"
        fields:
          - name: "partenaires"
            label: "Partenaires"
            label_singular: "Partenaire"
            widget: "list"
            summary: "{{fields.sigle}} — {{fields.nom.fr}}"
            fields:
              - {
                  name: "sigle",
                  label: "Sigle",
                  widget: "string",
                  hint: "Affiché dans une pastille tant qu'aucun logo n'est fourni.",
                }
              - { name: "nom", label: "Nom", widget: "object", fields: *bilingueCourt }
              - {
                  name: "logo",
                  label: "Logo",
                  widget: "image",
                  required: false,
                  hint: "Facultatif. Fond transparent de préférence.",
                }

  # ── Réalisations de terrain ──────────────────────────────────────────────
  - name: "realisations"
    label: "Réalisations de terrain"
    label_singular: "Réalisation"
    description: "Une fiche par campagne, avec sa galerie de photographies."
    folder: "src/data/campagnes"
    extension: "json"
    format: "json"
    create: true
    slug: "{{fields.slug}}"
    summary: "{{titre.fr}}"
    sortable_fields: ["ordre"]
    media_folder: "../../../public/images/actions"
    public_folder: "/images/actions"
    editor:
      preview: false
    fields:
      - {
          name: "ordre",
          label: "Ordre d'affichage",
          widget: "number",
          value_type: "int",
          hint: "Du plus petit au plus grand. Des écarts de dix permettent d'insérer une fiche sans renuméroter les autres.",
        }
      - {
          name: "slug",
          label: "Adresse de la page",
          widget: "string",
          pattern:
            [
              "^[a-z0-9]+(-[a-z0-9]+)*$",
              "Lettres minuscules non accentuées, chiffres et traits d'union.",
            ],
          hint: "Apparaît dans l'URL, par exemple covid-savon pour /realisations/covid-savon/.",
        }
      - {
          name: "vedette",
          label: "Mettre en vedette",
          widget: "boolean",
          required: false,
          default: false,
          hint: "Les réalisations en vedette alimentent le diaporama de la page d'accueil.",
        }
      - {
          name: "domaine",
          label: "Domaine",
          widget: "select",
          options:
            [
              { label: "Santé", value: "sante" },
              { label: "Social & développement", value: "social-developpement" },
              { label: "Cohésion sociale & paix", value: "cohesion-sociale" },
            ],
          hint: "Doit correspondre à un identifiant de la rubrique « Domaines d'action ».",
        }
      - { name: "titre", label: "Titre", widget: "object", fields: *bilingueCourt }
      - { name: "extrait", label: "Extrait", widget: "object", fields: *bilingueLong }
      - { name: "periode", label: "Période", widget: "object", fields: *bilingueCourt }
      - { name: "lieu", label: "Lieu", widget: "object", fields: *bilingueCourt }
      - {
          name: "financement",
          label: "Financement",
          widget: "object",
          required: false,
          fields: *bilingueCourt,
        }
      - {
          name: "resultat",
          label: "Résultat",
          widget: "object",
          required: false,
          fields: *bilingueCourt,
        }
      - { name: "texte", label: "Récit", widget: "object", fields: *bilingueLong }
      - name: "photos"
        label: "Photographies"
        label_singular: "Photographie"
        widget: "list"
        required: false
        summary: "{{fields.legende.fr}}"
        hint: "La première photographie sert de couverture, sur la carte et en tête de la fiche."
        fields:
          - { name: "src", label: "Image", widget: "image" }
          - { name: "legende", label: "Légende", widget: "object", fields: *bilingueCourt }
